ImageClusterSettings:
  table: image_cluster_settings
  parent_accessor: advanced
  accessor: imageCluster
  category: advanced
  ordinal_index: 120
  label: 图像聚类
  sections:
    基础:
      - name_en: enabled
        name_cn: 启用
        desc: 用于配置图像聚类中基础相关的启用。
        property_name: enabled
        value: true
        value_type: bool
        control_type: checkbox

    模型:
      - name_en: model
        name_cn: 模型
        desc: 用于配置图像聚类中模型相关的模型。
        property_name: model
        value: dinov2_vits14
        value_type: string
        control_type: combo
        options:
          - resnet18
          - resnet34
          - resnet50
          - dinov2_vits14
          - dinov2_vitb14
          - dinov2_vitl14
          - dinov2_vitg14
          - dinov2_vits14_reg
          - dinov2_vitb14_reg
          - dinov2_vitl14_reg
          - dinov2_vitg14_reg
          - dinov3_vits16
          - dinov3_vitb16
          - dinov3_vitl16

      - name_en: model_path
        name_cn: 模型文件
        desc: 用于配置图像聚类中模型相关的模型文件。
        property_name: modelPath
        value: ""
        value_type: string
        control_type: path

      - name_en: feature_name
        name_cn: 特征层
        desc: 用于配置图像聚类中模型相关的特征层。
        property_name: featureName
        value: x_norm_clstoken
        value_type: string
        control_type: combo
        options_key_field: model
        options_map:
          resnet18: [layer1, layer2, layer3, layer4]
          resnet34: [layer1, layer2, layer3, layer4]
          resnet50: [layer1, layer2, layer3, layer4]
          dinov2_vits14: [x_norm_clstoken, x_norm_patchtokens]
          dinov2_vitb14: [x_norm_clstoken, x_norm_patchtokens]
          dinov2_vitl14: [x_norm_clstoken, x_norm_patchtokens]
          dinov2_vitg14: [x_norm_clstoken, x_norm_patchtokens]
          dinov2_vits14_reg: [x_norm_clstoken, x_norm_patchtokens]
          dinov2_vitb14_reg: [x_norm_clstoken, x_norm_patchtokens]
          dinov2_vitl14_reg: [x_norm_clstoken, x_norm_patchtokens]
          dinov2_vitg14_reg: [x_norm_clstoken, x_norm_patchtokens]
          dinov3_vits16: [x_norm_clstoken, x_norm_patchtokens]
          dinov3_vitb16: [x_norm_clstoken, x_norm_patchtokens]
          dinov3_vitl16: [x_norm_clstoken, x_norm_patchtokens]

      - name_en: model_batch_size
        name_cn: 模型批量
        desc: 用于配置图像聚类中模型相关的模型批量。
        property_name: modelBatchSize
        value: 1
        value_type: int
        value_range: [1, 8192, 1]
        control_type: spin

    特征:
      - name_en: norm
        name_cn: 特征归一化
        desc: 用于配置图像聚类中特征相关的特征归一化。
        property_name: norm
        value: 2
        value_type: int
        control_type: combo
        options: [none, l1, l2]
        options_values:
          none: 0
          l1: 1
          l2: 2

      - name_en: use_pca
        name_cn: 启用 PCA
        desc: 用于配置图像聚类中特征相关的启用 PCA。
        property_name: usePca
        value: false
        value_type: bool
        control_type: checkbox

      - name_en: pca_dim
        name_cn: PCA 维度
        desc: 用于配置图像聚类中特征相关的PCA 维度。
        property_name: pcaDim
        value: 0
        value_type: int
        value_range: [0, 8192, 1]
        control_type: spin

    HDBSCAN:
      - name_en: min_cluster_size
        name_cn: 最小簇大小
        desc: 用于配置图像聚类中HDBSCAN相关的最小簇大小。
        property_name: minClusterSize
        value: 5
        value_type: int
        value_range: [2, 1000000, 1]
        control_type: spin

      - name_en: min_samples
        name_cn: 最小样本数
        desc: 用于配置图像聚类中HDBSCAN相关的最小样本数。
        property_name: minSamples
        value: 0
        value_type: int
        value_range: [0, 1000000, 1]
        control_type: spin

      - name_en: cluster_selection_epsilon
        name_cn: 簇选择 Epsilon
        desc: 用于配置图像聚类中HDBSCAN相关的簇选择 Epsilon。
        property_name: clusterSelectionEpsilon
        value: 0.0
        value_type: double
        value_range: [0.0, 1000000.0, 0.01]
        control_type: spin

      - name_en: max_cluster_size
        name_cn: 最大簇大小
        desc: 用于配置图像聚类中HDBSCAN相关的最大簇大小。
        property_name: maxClusterSize
        value: 0
        value_type: int
        value_range: [0, 1000000, 1]
        control_type: spin

      - name_en: algorithm
        name_cn: 邻居搜索
        desc: 用于配置图像聚类中HDBSCAN相关的邻居搜索。
        property_name: algorithm
        value: 2
        value_type: int
        control_type: combo
        options: [auto, brute, kd_tree, ball_tree]
        options_values:
          auto: 0
          brute: 1
          kd_tree: 2
          ball_tree: 3

      - name_en: cluster_selection_method
        name_cn: 簇选择方法
        desc: 用于配置图像聚类中HDBSCAN相关的簇选择方法。
        property_name: clusterSelectionMethod
        value: 0
        value_type: int
        control_type: combo
        options: [eom, leaf]
        options_values:
          eom: 0
          leaf: 1

    输出:
      - name_en: include_noise
        name_cn: 导出噪声簇
        desc: 用于配置图像聚类中输出相关的导出噪声簇。
        property_name: includeNoise
        value: true
        value_type: bool
        control_type: checkbox

      - name_en: apply_mode
        name_cn: 输出方式
        desc: 用于配置图像聚类中输出相关的输出方式。
        property_name: applyMode
        value: 0
        value_type: int
        control_type: combo
        options: [移动, 复制]
        options_values:
          移动: 0
          复制: 1

    运行时:
      - name_en: preprocess_backend
        name_cn: 预处理后端
        desc: 用于配置图像聚类中运行时相关的预处理后端。
        property_name: preprocessBackend
        value: 0
        value_type: int
        control_type: combo
        options: [cpu, gpu]
        options_values:
          cpu: 0
          gpu: 1

      - name_en: model_backend
        name_cn: 推理后端
        desc: 用于配置图像聚类中运行时相关的推理后端。
        property_name: modelBackend
        value: 0
        value_type: int
        control_type: combo
        options: [tensorrt, openvino, onnxruntime]
        options_values:
          tensorrt: 0
          openvino: 1
          onnxruntime: 2

      - name_en: model_device
        name_cn: 推理设备
        desc: 用于配置图像聚类中运行时相关的推理设备。
        property_name: modelDevice
        value: 1
        value_type: int
        control_type: combo
        options: [gpu, cpu]
        options_values:
          cpu: 0
          gpu: 1

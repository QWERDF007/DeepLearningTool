SoftwareSetting:
  table: software_setting
  accessor: software
  category: general
  ordinal_index: 10
  label: 软件设置
  sections:
    软件:
      - name_en: max_recent_projects
        name_cn: 最近项目数量
        description: 用于配置软件设置中软件相关的最近项目数量。
        property_name: maxRecentProjects
        value: 10
        value_type: int
        value_range: [1, 50, 1]
        display_type: spin

      - name_en: auto_save_interval
        name_cn: 自动保存间隔
        description: 用于配置软件设置中软件相关的自动保存间隔。
        property_name: autoSaveInterval
        value: 300
        value_type: int
        value_range: [30, 3600, 30]
        display_type: spin

      - name_en: auto_save_enabled
        name_cn: 启用自动保存
        description: 用于配置软件设置中软件相关的启用自动保存。
        property_name: autoSaveEnabled
        value: true
        value_type: bool
        display_type: checkbox

      - name_en: python_env_path
        name_cn: Python 环境目录
        description: 用于配置软件设置中软件相关的Python 环境目录。
        property_name: pythonEnvPath
        value: ""
        value_type: string
        display_type: dir

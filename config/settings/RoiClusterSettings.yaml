RoiClusterSettings:
  table: roi_cluster_settings
  parent_accessor: advanced
  accessor: roiCluster
  category: advanced
  ordinal_index: 130
  label: 标注聚类
  sections:
    基础:
      - name_en: enabled
        name_cn: 启用
        desc: 用于配置标注聚类中基础相关的启用。
        property_name: enabled
        value: true
        value_type: bool
        control_type: checkbox

    模型:
      - name_en: model
        name_cn: 模型
        desc: 用于配置标注聚类中模型相关的模型。
        property_name: model
        value: dinov2_vits14_reg
        value_type: string
        control_type: combo
        options:
          - resnet18
          - resnet34
          - resnet50
          - dinov2_vits14
          - dinov2_vitb14
          - dinov2_vitl14
          - dinov2_vitg14
          - dinov2_vits14_reg
          - dinov2_vitb14_reg
          - dinov2_vitl14_reg
          - dinov2_vitg14_reg
          - dinov3_vits16
          - dinov3_vitb16
          - dinov3_vitl16

      - name_en: model_path
        name_cn: 模型文件
        desc: 用于配置标注聚类中模型相关的模型文件。
        property_name: modelPath
        value: ""
        value_type: string
        control_type: path

      - name_en: feature_name
        name_cn: 特征层
        desc: 用于配置标注聚类中模型相关的特征层。
        property_name: featureName
        value: x_norm_patchtokens
        value_type: string
        control_type: combo
        options_key_field: model
        options_map:
          resnet18: [layer1, layer2, layer3, layer4]
          resnet34: [layer1, layer2, layer3, layer4]
          resnet50: [layer1, layer2, layer3, layer4]
          dinov2_vits14: [x_norm_patchtokens]
          dinov2_vitb14: [x_norm_patchtokens]
          dinov2_vitl14: [x_norm_patchtokens]
          dinov2_vitg14: [x_norm_patchtokens]
          dinov2_vits14_reg: [x_norm_patchtokens]
          dinov2_vitb14_reg: [x_norm_patchtokens]
          dinov2_vitl14_reg: [x_norm_patchtokens]
          dinov2_vitg14_reg: [x_norm_patchtokens]
          dinov3_vits16: [x_norm_patchtokens]
          dinov3_vitb16: [x_norm_patchtokens]
          dinov3_vitl16: [x_norm_patchtokens]

      - name_en: model_batch_size
        name_cn: 模型批量
        desc: 用于配置标注聚类中模型相关的模型批量。
        property_name: modelBatchSize
        value: 1
        value_type: int
        value_range: [1, 8192, 1]
        control_type: spin

    特征:
      - name_en: norm
        name_cn: 特征归一化
        desc: 用于配置标注聚类中特征相关的特征归一化。
        property_name: norm
        value: 2
        value_type: int
        control_type: combo
        options: [none, l1, l2]
        options_values:
          none: 0
          l1: 1
          l2: 2

      - name_en: use_pca
        name_cn: 启用 PCA
        desc: 用于配置标注聚类中特征相关的启用 PCA。
        property_name: usePca
        value: false
        value_type: bool
        control_type: checkbox

      - name_en: pca_dim
        name_cn: PCA 维度
        desc: 用于配置标注聚类中特征相关的 PCA 维度。
        property_name: pcaDim
        value: 0
        value_type: int
        value_range: [0, 8192, 1]
        control_type: spin

    ROI:
      - name_en: pooled_height
        name_cn: ROI 输出高度
        desc: 用于配置标注聚类中 ROIAlign 的输出高度。
        property_name: pooledHeight
        value: 7
        value_type: int
        value_range: [1, 64, 1]
        control_type: spin

      - name_en: pooled_width
        name_cn: ROI 输出宽度
        desc: 用于配置标注聚类中 ROIAlign 的输出宽度。
        property_name: pooledWidth
        value: 7
        value_type: int
        value_range: [1, 64, 1]
        control_type: spin

      - name_en: sampling_ratio
        name_cn: ROI 采样比例
        desc: 用于配置标注聚类中 ROIAlign 的采样比例。
        property_name: samplingRatio
        value: -1
        value_type: int
        value_range: [-1, 32, 1]
        control_type: spin

      - name_en: aligned
        name_cn: ROI 对齐
        desc: 用于配置标注聚类中 ROIAlign 的坐标规则。
        property_name: aligned
        value: false
        value_type: bool
        control_type: checkbox

    HDBSCAN:
      - name_en: min_cluster_size
        name_cn: 最小簇大小
        desc: 用于配置标注聚类中 HDBSCAN 的最小簇大小。
        property_name: minClusterSize
        value: 5
        value_type: int
        value_range: [2, 1000000, 1]
        control_type: spin

      - name_en: min_samples
        name_cn: 最小样本数
        desc: 用于配置标注聚类中 HDBSCAN 的最小样本数。
        property_name: minSamples
        value: 0
        value_type: int
        value_range: [0, 1000000, 1]
        control_type: spin

      - name_en: cluster_selection_epsilon
        name_cn: 簇选择 Epsilon
        desc: 用于配置标注聚类中 HDBSCAN 的簇选择 Epsilon。
        property_name: clusterSelectionEpsilon
        value: 0.0
        value_type: double
        value_range: [0.0, 1000000.0, 0.01]
        control_type: spin

      - name_en: max_cluster_size
        name_cn: 最大簇大小
        desc: 用于配置标注聚类中 HDBSCAN 的最大簇大小。
        property_name: maxClusterSize
        value: 0
        value_type: int
        value_range: [0, 1000000, 1]
        control_type: spin

      - name_en: algorithm
        name_cn: 邻居搜索
        desc: 用于配置标注聚类中 HDBSCAN 的邻居搜索算法。
        property_name: algorithm
        value: 1
        value_type: int
        control_type: combo
        options: [brute, kd_tree, ball_tree]
        options_values:
          brute: 0
          kd_tree: 1
          ball_tree: 2

      - name_en: metric
        name_cn: 距离度量
        desc: 用于配置标注聚类中 HDBSCAN 的距离度量。
        property_name: metric
        value: 0
        value_type: int
        control_type: combo
        options: [euclidean, cosine, manhattan, chebyshev, minkowski]
        options_values:
          euclidean: 0
          cosine: 1
          manhattan: 2
          chebyshev: 3
          minkowski: 4

      - name_en: cluster_selection_method
        name_cn: 簇选择方法
        desc: 用于配置标注聚类中 HDBSCAN 的簇选择方法。
        property_name: clusterSelectionMethod
        value: 0
        value_type: int
        control_type: combo
        options: [eom, leaf]
        options_values:
          eom: 0
          leaf: 1

    输出:
      - name_en: include_noise
        name_cn: 包含噪声
        desc: 是否为 HDBSCAN 噪声 ROI 创建 Tag。
        property_name: includeNoise
        value: false
        value_type: bool
        control_type: checkbox

    运行时:
      - name_en: preprocess_backend
        name_cn: 预处理后端
        desc: 用于配置标注聚类的预处理后端。
        property_name: preprocessBackend
        value: 0
        value_type: int
        control_type: combo
        options: [cpu, gpu]
        options_values:
          cpu: 0
          gpu: 1

      - name_en: model_runtime
        name_cn: 运行时设备
        desc: 用于配置标注聚类中模型推理的后端和设备。
        property_name: modelRuntime
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: inferrt.compute_devices

      - name_en: model_precision
        name_cn: 推理精度
        desc: 用于配置标注聚类中 TensorRT 模型的推理精度。
        property_name: modelPrecision
        value: 0
        value_type: int
        control_type: combo
        options: [FP32, FP16]
        options_values:
          FP32: 0
          FP16: 1

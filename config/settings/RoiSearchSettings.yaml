RoiSearchSettings:
  table: roi_search_settings
  parent_accessor: advanced
  accessor: roiSearch
  category: advanced
  ordinal_index: 110
  label: 标注搜索
  sections:
    基础:
      - name_en: enabled
        name_cn: 启用
        description: 用于配置标注搜索中基础相关的启用。
        property_name: enabled
        value: true
        value_type: bool
        display_type: checkbox

    模型:
      - name_en: model
        name_cn: 模型
        description: 用于配置标注搜索中模型相关的模型。
        property_name: model
        value: dinov3_vits16
        value_type: string
        display_type: combo
        options:
          - resnet18
          - resnet34
          - resnet50
          - dinov2_vits14
          - dinov2_vitb14
          - dinov2_vitl14
          - dinov2_vitg14
          - dinov2_vits14_reg
          - dinov2_vitb14_reg
          - dinov2_vitl14_reg
          - dinov2_vitg14_reg
          - dinov3_vits16
          - dinov3_vitb16
          - dinov3_vitl16

      - name_en: model_path
        name_cn: 模型文件
        description: 用于配置标注搜索中模型相关的模型文件。
        property_name: modelPath
        value: ""
        value_type: string
        display_type: path

      - name_en: feature_name
        name_cn: 特征层
        description: 用于配置标注搜索中模型相关的特征层。
        property_name: featureName
        value: x_norm_patchtokens
        value_type: string
        display_type: combo
        options_key_field: model
        options_map:
          resnet18: [layer1, layer2, layer3, layer4]
          resnet34: [layer1, layer2, layer3, layer4]
          resnet50: [layer1, layer2, layer3, layer4]
          dinov2_vits14: [x_norm_patchtokens]
          dinov2_vitb14: [x_norm_patchtokens]
          dinov2_vitl14: [x_norm_patchtokens]
          dinov2_vitg14: [x_norm_patchtokens]
          dinov2_vits14_reg: [x_norm_patchtokens]
          dinov2_vitb14_reg: [x_norm_patchtokens]
          dinov2_vitl14_reg: [x_norm_patchtokens]
          dinov2_vitg14_reg: [x_norm_patchtokens]
          dinov3_vits16: [x_norm_patchtokens]
          dinov3_vitb16: [x_norm_patchtokens]
          dinov3_vitl16: [x_norm_patchtokens]

      - name_en: model_batch_size
        name_cn: 模型批量
        description: 用于配置标注搜索中模型相关的模型批量。
        property_name: modelBatchSize
        value: 1
        value_type: int
        value_range: [1, 8192, 1]
        display_type: spin

    索引:
      - name_en: rebuild_index
        name_cn: 重建索引
        description: 用于配置标注搜索中索引相关的重建索引。
        property_name: rebuildIndex
        value: false
        value_type: bool
        display_type: checkbox

      - name_en: exact_search
        name_cn: 精确搜索
        description: 启用精确内积搜索，杜绝近似量化损失。
        property_name: exactSearch
        value: true
        value_type: bool
        display_type: checkbox

      - name_en: top_k
        name_cn: 返回数量
        description: 用于配置标注搜索中索引相关的返回数量。
        property_name: topK
        value: 5
        value_type: int
        value_range: [1, 1000, 1]
        display_type: spin

      - name_en: norm
        name_cn: 特征归一化
        description: 用于配置标注搜索中索引相关的特征归一化。
        property_name: norm
        value: 2
        value_type: int
        display_type: combo
        options: [none, l1, l2]
        options_values:
          none: 0
          l1: 1
          l2: 2

      - name_en: index_storage
        name_cn: 索引存储
        description: 用于配置标注搜索中索引相关的索引存储。
        property_name: indexStorage
        value: 0
        value_type: int
        display_type: combo
        options: [ram, disk]
        options_values:
          ram: 0
          disk: 1

    运行时:
      - name_en: preprocess_backend
        name_cn: 预处理后端
        description: 用于配置标注搜索中运行时相关的预处理后端。
        property_name: preprocessBackend
        value: 0
        value_type: int
        display_type: combo
        options: [cpu, gpu]
        options_values:
          cpu: 0
          gpu: 1

      - name_en: faiss_backend
        name_cn: FAISS 后端
        description: 用于配置标注搜索中运行时相关的FAISS 后端。
        property_name: faissBackend
        value: 0
        value_type: int
        display_type: combo
        options: [cpu, gpu]
        options_values:
          cpu: 0
          gpu: 1

      - name_en: model_runtime
        name_cn: 运行时设备
        description: 用于配置标注搜索中模型推理的后端和设备。
        property_name: modelRuntime
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: inferrt.compute_devices

      - name_en: model_precision
        name_cn: 推理精度
        description: 用于配置标注搜索中 TensorRT 模型的推理精度。
        property_name: modelPrecision
        value: 0
        value_type: int
        display_type: combo
        options: [FP32, FP16]
        options_values:
          FP32: 0
          FP16: 1

    特征:
      - name_en: mode
        name_cn: 特征提取模式
        description: 用于配置标注特征提取模式（默认原图裁剪掩膜汇聚）。
        property_name: mode
        value: 0
        value_type: int
        display_type: combo
        options: [crop_masked_mean, legacy_roi_align]
        options_values:
          crop_masked_mean: 0
          legacy_roi_align: 1

      - name_en: crop_margin
        name_cn: 原图留边比例
        description: 原图裁剪时的留边比例。
        property_name: cropMargin
        value: 0.05
        value_type: double
        value_range: [0.0, 0.5, 0.01]
        display_type: spin

      - name_en: patch_size
        name_cn: Patch 尺寸
        description: Vision Transformer 的 Patch 大小。
        property_name: patchSize
        value: 16
        value_type: int
        value_range: [1, 64, 1]
        display_type: spin

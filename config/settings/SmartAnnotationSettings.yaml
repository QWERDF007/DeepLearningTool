SmartAnnotationSettings:
  table: smart_annotation_settings
  parent_accessor: advanced
  accessor: smartAnnotation
  label: 智能标注
  fields:
    - name_en: enabled
      name_cn: 启用
      property_name: enabled
      value: false
      value_type: bool
      control_type: checkbox
      section: 基础

    - name_en: model
      name_cn: 模型
      property_name: model
      value: edge_sam
      value_type: string
      control_type: combo
      options: [edge_sam, sam_vit_b, sam_vit_l, sam_vit_h, sam2_hiera_tiny, sam2_hiera_small, sam2_hiera_base_plus, sam2_hiera_large, sam2_1_hiera_tiny, sam2_1_hiera_small, sam2_1_hiera_base_plus, sam2_1_hiera_large]
      section: 模型

    - name_en: model_path
      name_cn: 模型文件
      property_name: modelPath
      value: F:/models/edge_sam.wts
      value_type: string
      control_type: path
      section: 模型

    - name_en: model_backend
      name_cn: 推理后端
      property_name: modelBackend
      value: tensorrt
      value_type: string
      control_type: combo
      options: [tensorrt, openvino, onnxruntime]
      section: 运行时

    - name_en: model_device
      name_cn: 推理设备
      property_name: modelDevice
      value: gpu
      value_type: string
      control_type: combo
      options: [gpu, cpu]
      section: 运行时

    - name_en: mask_threshold
      name_cn: Mask 阈值
      property_name: maskThreshold
      value: 0.0
      value_type: double
      value_range: [-20.0, 20.0, 0.1]
      control_type: slider
      section: Mask

    - name_en: polygon_simplify_epsilon
      name_cn: 轮廓简化
      property_name: polygonSimplifyEpsilon
      value: 2.0
      value_type: double
      value_range: [0.0, 50.0, 0.5]
      control_type: slider
      section: Mask

    - name_en: mask_alpha
      name_cn: Mask 透明度
      property_name: maskAlpha
      value: 0.35
      value_type: double
      value_range: [0.0, 1.0, 0.05]
      control_type: slider
      section: Mask

    - name_en: refresh_interval
      name_cn: 刷新间隔
      property_name: refreshInterval
      value: 80
      value_type: int
      value_range: [20, 5000, 10]
      control_type: spin
      section: 预览

SmartAnnotationSettings:
  table: smart_annotation_settings
  parent_accessor: advanced
  accessor: smartAnnotation
  category: advanced
  ordinal_index: 120
  label: 智能标注
  sections:
    基础:
      - name_en: enabled
        name_cn: 启用
        desc: 用于配置智能标注中基础相关的启用。
        property_name: enabled
        value: false
        value_type: bool
        control_type: checkbox

    模型:
      - name_en: model
        name_cn: 模型
        desc: 用于配置智能标注中模型相关的模型。
        property_name: model
        value: edge_sam
        value_type: string
        control_type: combo
        options: [edge_sam, sam_vit_b, sam_vit_l, sam_vit_h, sam2_hiera_tiny, sam2_hiera_small, sam2_hiera_base_plus, sam2_hiera_large, sam2_1_hiera_tiny, sam2_1_hiera_small, sam2_1_hiera_base_plus, sam2_1_hiera_large]

      - name_en: model_path
        name_cn: 模型文件
        desc: 用于配置智能标注中模型相关的模型文件。
        property_name: modelPath
        value: F:/models/edge_sam.wts
        value_type: string
        control_type: path

    运行时:
      - name_en: model_backend
        name_cn: 推理后端
        desc: 用于配置智能标注中运行时相关的推理后端。
        property_name: modelBackend
        value: 0
        value_type: int
        control_type: combo
        options: [tensorrt, openvino, onnxruntime]
        options_values:
          tensorrt: 0
          openvino: 1
          onnxruntime: 2

      - name_en: model_device
        name_cn: 推理设备
        desc: 用于配置智能标注中运行时相关的推理设备。
        property_name: modelDevice
        value: 1
        value_type: int
        control_type: combo
        options: [gpu, cpu]
        options_values:
          cpu: 0
          gpu: 1

    Mask:
      - name_en: mask_threshold
        name_cn: Mask 阈值
        desc: 用于配置智能标注中Mask相关的Mask 阈值。
        property_name: maskThreshold
        value: 0.0
        value_type: double
        value_range: [-20.0, 20.0, 0.1]
        control_type: slider

      - name_en: polygon_simplify_epsilon
        name_cn: 轮廓简化
        desc: 用于配置智能标注中Mask相关的轮廓简化。
        property_name: polygonSimplifyEpsilon
        value: 2.0
        value_type: double
        value_range: [0.0, 50.0, 0.5]
        control_type: slider

      - name_en: mask_alpha
        name_cn: Mask 透明度
        desc: 用于配置智能标注中Mask相关的Mask 透明度。
        property_name: maskAlpha
        value: 0.35
        value_type: double
        value_range: [0.0, 1.0, 0.05]
        control_type: slider

    预览:
      - name_en: refresh_interval
        name_cn: 刷新间隔
        desc: 用于配置智能标注中预览相关的刷新间隔。
        property_name: refreshInterval
        value: 80
        value_type: int
        value_range: [20, 5000, 10]
        control_type: spin

      - name_en: use_viewport_input
        name_cn: 使用可视窗口
        desc: 用于配置智能标注中预览相关的使用可视窗口。
        property_name: useViewportInput
        value: false
        value_type: bool
        control_type: checkbox

YOLOv5:
  framework: ultralytics
  model_architecture: YOLOv5
  model_name: YOLOv5
  method: Detection
  train_params:
    - name_en: network
      name_cn: 网络参数
      part_index: 0
      params:
        - name_en: image_size
          name_cn: 图像尺寸
          value: 640
          value_type: int
          value_range: [320, 1536, 32]
          control_type: spin

        - name_en: num_classes
          name_cn: 类别数
          value: 80
          value_type: int
          value_range: [1, 10000, 1]
          control_type: spin

        - name_en: pretrained
          name_cn: 预训练权重
          value: COCO
          value_type: string
          control_type: combo
          options: ["None", COCO, Custom]

    - name_en: training
      name_cn: 训练参数
      part_index: 0
      params:
        - name_en: epochs
          name_cn: 训练轮数
          value: 100
          value_type: int
          value_range: [1, 10000, 1]
          control_type: spin

        - name_en: batch_size
          name_cn: 批量大小
          value: 16
          value_type: int
          value_range: [1, 512, 1]
          control_type: spin

        - name_en: learning_rate
          name_cn: 学习率
          value: 0.01
          value_type: double
          value_range: [0.000001, 1.0, 0.0001]
          control_type: spin

        - name_en: optimizer
          name_cn: 优化器
          value: SGD
          value_type: string
          control_type: combo
          options: [SGD, Adam, AdamW]

    - name_en: augmentation
      name_cn: 数据增强
      part_index: 1
      params:
        - name_en: mosaic
          name_cn: Mosaic
          value: true
          value_type: bool
          control_type: checkbox

        - name_en: mixup
          name_cn: MixUp
          value: false
          value_type: bool
          control_type: checkbox

        - name_en: hsv_gain
          name_cn: HSV 增益
          value: 0.015
          value_type: double
          value_range: [0.0, 0.1, 0.001]
          control_type: slider

        - name_en: flip_probability
          name_cn: 翻转概率
          value: 0.5
          value_type: double
          value_range: [0.0, 1.0, 0.01]
          control_type: slider

  test_params:
    - name_en: inference
      name_cn: 推理参数
      part_index: 0
      params:
        - name_en: image_size
          name_cn: 图像尺寸
          value: 640
          value_type: int
          value_range: [320, 1536, 32]
          control_type: spin

        - name_en: confidence_threshold
          name_cn: 置信度阈值
          value: 0.25
          value_type: double
          value_range: [0.0, 1.0, 0.01]
          control_type: slider

        - name_en: nms_threshold
          name_cn: NMS 阈值
          value: 0.45
          value_type: double
          value_range: [0.0, 1.0, 0.01]
          control_type: slider

    - name_en: evaluation
      name_cn: 评估参数
      part_index: 1
      params:
        - name_en: batch_size
          name_cn: 批量大小
          value: 8
          value_type: int
          value_range: [1, 512, 1]
          control_type: spin

        - name_en: metric
          name_cn: 评估指标
          value: "mAP@0.5"
          value_type: string
          control_type: combo
          options: ["mAP@0.5", "mAP@0.5:0.95", Recall]

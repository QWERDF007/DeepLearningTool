framework: dinomaly2
model_architecture: dinomaly2
model_name: Dinomaly2
method: AnomalyDetection
train_params:
  - name_en: network
    name_cn: 网络配置
    part_index: 0
    params:
      - name_en: image_size
        name_cn: 图像大小
        description: 输入模型前将图像缩放到的边长。
        value: 448
        value_type: int
        value_range: [128, 2048, 1]
        control_type: spin

      - name_en: crop_size
        name_cn: 裁剪尺寸
        description: 训练前从缩放后的图像中心裁剪出的目标边长。
        value: 392
        value_type: int
        value_range: [64, 2048, 1]
        control_type: spin

      - name_en: encoder_name
        name_cn: 预训练模型
        description: 用于提取图像特征的 DINOv2 预训练编码器版本。
        value: dinov2reg_vit_base_14
        value_type: string
        control_type: combo
        options: [dinov2reg_vit_small_14, dinov2reg_vit_base_14, dinov2reg_vit_large_14]

      - name_en: image_channels
        name_cn: 图像通道
        description: Dinomaly2 仅支持 RGB 三通道输入。
        value: 3
        value_type: int
        control_type: combo
        options: [3]
        enabled: false

      - name_en: dropout
        name_cn: 瓶颈 Dropout
        description: 瓶颈层在训练时随机失活的比例。
        value: 0.4
        value_type: double
        value_range: [0.0, 0.9, 0.01]
        control_type: spin

      - name_en: la
        name_cn: 线性注意力
        description: 解码器是否使用线性注意力（1 使用，0 使用标准注意力）。
        value: true
        value_type: bool
        control_type: checkbox

      - name_en: lc
        name_cn: 松散约束分组
        description: 编码器与解码器特征融合的分组方式（0 逐层，1 一组，2 两组，3 三组，4 四组，11/12/14 稀疏）。
        value: 2
        value_type: int
        control_type: combo
        options: [0, 1, 2, 3, 4, 11, 12, 14]

      - name_en: ll
        name_cn: 松散损失
        description: 是否启用丢弃低距离区域的松散余弦损失。
        value: true
        value_type: bool
        control_type: checkbox

      - name_en: ll_ratio
        name_cn: 松散损失比例
        description: 松散损失中低距离区域被丢弃的比例（0.9 表示 90%）。
        value: 0.9
        value_type: double
        value_range: [0.0, 1.0, 0.01]
        control_type: spin

      - name_en: ll_factor
        name_cn: 松散损失梯度系数
        description: 被丢弃区域的梯度缩放系数。
        value: 0.1
        value_type: double
        value_range: [0.0, 1.0, 0.01]
        control_type: spin

      - name_en: cr
        name_cn: 上下文重居中
        description: 是否对上下文特征执行重居中处理。
        value: true
        value_type: bool
        control_type: checkbox

  - name_en: training
    name_cn: 训练配置
    part_index: 0
    params:
      - name_en: max_iters
        name_cn: Max Iters（最大迭代次数）
        description: 训练允许执行的最大优化步骤数。
        value: 40000
        value_type: int
        value_range: [1, 200000, 1]
        control_type: spin

      - name_en: batch_size
        name_cn: 批量大小
        description: 每次训练处理的图像数量。
        value: 8
        value_type: int
        value_range: [1, 128, 1]
        control_type: spin

      - name_en: lr_decay_ratio
        name_cn: 学习率衰减比例
        description: 余弦退火结束时学习率相对初始值的比例。
        value: 1.0
        value_type: double
        value_range: [0.01, 1.0, 0.01]
        control_type: spin

      - name_en: seed
        name_cn: 随机种子
        description: 训练随机种子，用于复现实验结果。
        value: 1
        value_type: int
        value_range: [0, 1000000, 1]
        control_type: spin

      - name_en: device
        name_cn: 设备
        description: 选择执行训练的计算设备。
        value: cuda:0
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: training.compute_devices

      - name_en: num_workers
        name_cn: 数据加载进程
        description: 用于并行读取和预处理数据的工作进程数。
        value: 4
        value_type: int
        value_range: [0, 64, 1]
        control_type: spin

  - name_en: mask
    name_cn: Mask 约束
    part_index: 0
    params:
      - name_en: good_value
        name_cn: Good 像素值
        description: 未由项目自动传递时使用的 Good 类别像素值列表（逗号分隔）。训练时项目会按数据管理中 Good 类别的类别值自动传递，此处仅在手动运行 Python 时作为默认值。
        value: 1
        value_type: string
        control_type: text

      - name_en: anomaly_value
        name_cn: 异常像素值
        description: 未由项目自动传递时使用的异常类别像素值列表（逗号分隔）。训练时项目会按数据管理中 Anomaly 类别的类别值自动传递，此处仅在手动运行 Python 时作为默认值。
        value: 255
        value_type: string
        control_type: text

      - name_en: ignore_value
        name_cn: 忽略像素值
        description: 未由项目自动传递时使用的忽略像素值列表（逗号分隔）。训练时项目会按数据管理中 Unlabeled 类别的类别值自动传递，这些像素不参与任何 Mask 约束损失。
        value: 254
        value_type: string
        control_type: text

      - name_en: aug_hflip_prob
        name_cn: 随机水平翻转概率
        description: 训练时对图像与 Mask 同步随机水平翻转的概率，0 表示关闭。
        value: 0
        value_type: double
        value_range: [0.0, 1.0, 0.05]
        control_type: spin

      - name_en: aug_brightness
        name_cn: 亮度抖动强度
        description: 训练时亮度抖动强度，0 表示关闭。
        value: 0
        value_type: double
        value_range: [0.0, 1.0, 0.05]
        control_type: spin

      - name_en: aug_contrast
        name_cn: 对比度抖动强度
        description: 训练时对比度抖动强度，0 表示关闭。
        value: 0
        value_type: double
        value_range: [0.0, 1.0, 0.05]
        control_type: spin

      - name_en: aug_hue
        name_cn: 色相抖动强度
        description: 训练时色相抖动强度（[0, 0.5]），0 表示关闭。
        value: 0
        value_type: double
        value_range: [0.0, 0.5, 0.05]
        control_type: spin

      - name_en: lambda_good
        name_cn: Good 损失权重
        description: 限制在 good 像素上的 Dinomaly2 损失的权重。
        value: 0.5
        value_type: double
        value_range: [0.0, 10.0, 0.1]
        control_type: spin

      - name_en: lambda_anomaly
        name_cn: 异常损失权重
        description: 限制在异常区域的 Dinomaly2 损失（最大化）的权重。
        value: 0.5
        value_type: double
        value_range: [0.0, 10.0, 0.1]
        control_type: spin

test_params:
  - name_en: data
    name_cn: 测试数据
    part_index: 0
    params:
      - name_en: batch_size
        name_cn: 批量大小
        description: 每次测试处理的图像数量。
        value: 8
        value_type: int
        value_range: [1, 128, 1]
        control_type: spin

      - name_en: num_workers
        name_cn: 数据加载进程
        description: 用于并行读取和预处理测试数据的工作进程数。
        value: 4
        value_type: int
        value_range: [0, 64, 1]
        control_type: spin

  - name_en: inference
    name_cn: 推理配置
    part_index: 1
    params:
      - name_en: device
        name_cn: 设备
        description: 选择执行测试的计算设备。
        value: cuda:0
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: training.compute_devices

      - name_en: checkpoint_path
        name_cn: 检查点路径
        description: 用于测试的模型检查点文件路径，留空使用训练输出的 model.pth。
        value: ""
        value_type: string
        control_type: file

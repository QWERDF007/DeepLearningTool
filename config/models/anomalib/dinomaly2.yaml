framework: anomalib
model_architecture: dinomaly2
model_name: Dinomaly2
method: AnomalyDetection
train_params:
  - name_en: network
    name_cn: 网络配置
    part_index: 0
    params:
      - name_en: image_size
        name_cn: 图像大小
        description: 输入模型前将图像缩放到的边长。
        value: 448
        value_type: int
        value_range: [128, 2048, 1]
        display_type: spin

      - name_en: encoder_name
        name_cn: 预训练模型
        description: 用于提取图像特征的 DINOv2 预训练编码器版本。
        value: dinov2reg_vit_base_14
        value_type: string
        display_type: combo
        options: [dinov2reg_vit_small_14, dinov2reg_vit_base_14, dinov2reg_vit_large_14]

      - name_en: checkpoint
        name_cn: 初始权重
        description: 训练使用的初始权重：同架构用户已训练权重，留空使用默认初始化。
        value: ""
        value_type: string
        display_type: group_combo
        param_type: dynamic
        backend_key: model.checkpoints
        model_param_name: encoder_name

      - name_en: image_channels
        name_cn: 图像通道
        description: 当前 anomalib 图像模型要求使用 RGB 三通道输入。
        value: 3
        value_type: int
        display_type: combo
        options: [3]
        enabled: false

      - name_en: crop_size
        name_cn: 裁剪尺寸
        description: 训练前从缩放后的图像中心裁剪出的目标边长。
        value: 392
        value_type: int
        value_range: [64, 2048, 1]
        display_type: spin

  - name_en: training
    name_cn: 训练配置
    part_index: 0
    params:
      - name_en: max_steps
        name_cn: Max Iters（最大迭代次数）
        description: 训练允许执行的最大优化步骤数。
        value: 5000
        value_type: int
        value_range: [1, 200000, 1]
        display_type: spin

      - name_en: batch_size
        name_cn: 批量大小
        description: 每次训练或验证处理的图像数量。
        value: 8
        value_type: int
        value_range: [1, 128, 1]
        display_type: spin

      - name_en: learning_rate
        name_cn: 学习率
        description: StableAdamW 优化器的初始学习率。
        value: 0.002
        value_type: double
        value_range: [0.000001, 1.0, 0.000001]
        display_type: spin

      - name_en: device
        name_cn: 设备
        description: 选择执行训练的计算设备。
        value: cuda:0
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: training.compute_devices

      - name_en: num_workers
        name_cn: 数据加载进程
        description: 用于并行读取和预处理数据的工作进程数。
        value: 2
        value_type: int
        value_range: [0, 64, 1]
        display_type: spin

      - name_en: check_val_every_n_epoch
        name_cn: 验证间隔
        description: 每 N 个 Epoch 运行一次验证。增大该值可减少验证和 worker 重建造成的卡顿。
        value: 5
        value_type: int
        value_range: [1, 1000, 1]
        display_type: spin

      - name_en: checkpoint_every_n_epoch
        name_cn: 保存间隔
        description: 每 N 个 Epoch 保存一次模型 checkpoint。增大该值可减少写盘造成的卡顿。
        value: 5
        value_type: int
        value_range: [1, 1000, 1]
        display_type: spin

      - name_en: decoder_depth
        name_cn: 解码器深度
        description: 解码器中堆叠的网络层数。
        value: 8
        value_type: int
        value_range: [2, 24, 1]
        display_type: spin

      - name_en: bottleneck_dropout
        name_cn: 瓶颈 Dropout
        description: 瓶颈层在训练时随机失活的比例。
        value: 0.2
        value_type: double
        value_range: [0.0, 0.9, 0.01]
        display_type: spin

      - name_en: use_context_recentering
        name_cn: 上下文重居中
        description: 是否对上下文特征执行重居中处理。
        value: true
        value_type: bool
        display_type: checkbox

      - name_en: precision
        name_cn: 计算精度
        description: 模型训练和推理使用的浮点计算精度。
        value: float32
        value_type: string
        display_type: combo
        options: [float32, float16]

test_params:
  - name_en: inference
    name_cn: 推理参数
    part_index: 0
    params:
      - name_en: batch_size
        name_cn: 批量大小
        description: 每次推理处理的图像数量。
        value: 8
        value_type: int
        value_range: [1, 128, 1]
        display_type: spin

      - name_en: num_workers
        name_cn: 数据加载进程
        description: 用于并行读取和预处理测试数据的工作进程数。
        value: 2
        value_type: int
        value_range: [0, 64, 1]
        display_type: spin

      - name_en: classification_threshold
        name_cn: 分类阈值
        description: 图像分数大于等于该值时判定为异常，否则判定为正常。
        value: 0.5
        value_type: double
        value_range: [-1000000.0, 1000000.0, 0.0001]
        display_type: spin

      - name_en: device
        name_cn: 设备
        description: 选择执行测试的计算设备。
        value: cuda:0
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: training.compute_devices

      - name_en: checkpoint
        name_cn: 权重
        description: 推理使用的模型权重：用户已训练权重，留空使用当前模型训练的权重。
        value: ""
        value_type: string
        display_type: group_combo
        param_type: dynamic
        backend_key: model.checkpoints
        model_param_name: encoder_name

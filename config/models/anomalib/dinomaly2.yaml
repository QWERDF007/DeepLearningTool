framework: anomalib
model_architecture: dinomaly2
model_name: Dinomaly2
method: AnomalyDetection
train_params:
  - name_en: data
    name_cn: 数据参数
    part_index: 0
    params:
      - name_en: train_batch_size
        name_cn: 训练批量
        description: 每次参数更新参与训练的图像数量。
        value: 8
        value_type: int
        value_range: [1, 128, 1]
        control_type: spin

      - name_en: eval_batch_size
        name_cn: 评估批量
        description: 每次验证或评估处理的图像数量。
        value: 8
        value_type: int
        value_range: [1, 128, 1]
        control_type: spin

      - name_en: num_workers
        name_cn: 加载线程
        description: 用于并行读取和预处理数据的工作线程数。
        value: 8
        value_type: int
        value_range: [0, 64, 1]
        control_type: spin

  - name_en: trainer
    name_cn: 训练器参数
    part_index: 0
    params:
      - name_en: device
        name_cn: 计算设备
        description: 选择执行训练的计算设备。
        value: cuda:0
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: training.compute_devices

      - name_en: accelerator
        name_cn: 加速器
        description: 指定训练框架使用的硬件加速后端。
        value: auto
        value_type: string
        control_type: combo
        options: [auto, cpu, gpu, cuda]

      - name_en: devices
        name_cn: 设备数
        description: 参与训练的计算设备数量。
        value: 1
        value_type: int
        value_range: [1, 16, 1]
        control_type: spin

      - name_en: max_steps
        name_cn: 最大步数
        description: 训练允许执行的最大优化步骤数。
        value: 5000
        value_type: int
        value_range: [1, 200000, 1]
        control_type: spin

      - name_en: seed
        name_cn: 随机种子
        description: 控制随机过程以便复现实验结果的种子值。
        value: 42
        value_type: int
        value_range: [0, 2147483647, 1]
        control_type: spin

  - name_en: model
    name_cn: 模型参数
    part_index: 1
    params:
      - name_en: encoder_name
        name_cn: 编码器
        description: 用于提取图像特征的 DINOv2 编码器版本。
        value: dinov2reg_vit_base_14
        value_type: string
        control_type: combo
        options: [dinov2reg_vit_small_14, dinov2reg_vit_base_14, dinov2reg_vit_large_14]

      - name_en: decoder_depth
        name_cn: 解码器深度
        description: 解码器中堆叠的网络层数。
        value: 8
        value_type: int
        value_range: [1, 24, 1]
        control_type: spin

      - name_en: bottleneck_dropout
        name_cn: 瓶颈 Dropout
        description: 瓶颈层在训练时随机失活的比例。
        value: 0.2
        value_type: double
        value_range: [0.0, 0.9, 0.01]
        control_type: spin

      - name_en: use_context_recentering
        name_cn: 上下文重居中
        description: 是否对上下文特征执行重居中处理。
        value: true
        value_type: bool
        control_type: checkbox

      - name_en: image_size
        name_cn: 输入尺寸
        description: 输入模型前将图像缩放到的边长。
        value: 448
        value_type: int
        value_range: [128, 2048, 1]
        control_type: spin

      - name_en: crop_size
        name_cn: 裁剪尺寸
        description: 训练前从输入图像中裁剪出的目标边长。
        value: 392
        value_type: int
        value_range: [64, 2048, 1]
        control_type: spin

      - name_en: precision
        name_cn: 精度
        description: 训练和推理使用的浮点计算精度。
        value: float32
        value_type: string
        control_type: combo
        options: [float32, float16]

test_params:
  - name_en: data
    name_cn: 测试数据
    part_index: 0
    params:
      - name_en: eval_batch_size
        name_cn: 评估批量
        description: 每次测试处理的图像数量。
        value: 8
        value_type: int
        value_range: [1, 128, 1]
        control_type: spin

      - name_en: num_workers
        name_cn: 加载线程
        description: 用于并行读取和预处理测试数据的工作线程数。
        value: 8
        value_type: int
        value_range: [0, 64, 1]
        control_type: spin

  - name_en: inference
    name_cn: 推理参数
    part_index: 1
    params:
      - name_en: device
        name_cn: 计算设备
        description: 选择执行推理的计算设备。
        value: cuda:0
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: inferrt.compute_devices

      - name_en: checkpoint_path
        name_cn: 检查点路径
        description: 用于推理或评估的模型检查点文件路径。
        value: ""
        value_type: string
        control_type: file

      - name_en: accelerator
        name_cn: 加速器
        description: 指定推理框架使用的硬件加速后端。
        value: auto
        value_type: string
        control_type: combo
        options: [auto, cpu, gpu, cuda]

      - name_en: devices
        name_cn: 设备数
        description: 参与推理的计算设备数量。
        value: 1
        value_type: int
        value_range: [1, 16, 1]
        control_type: spin

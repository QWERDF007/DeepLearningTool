framework: anomalib
model_architecture: patchcore
model_name: PatchCore
method: AnomalyDetection
train_params:
  - name_en: network
    name_cn: 网络配置
    part_index: 0
    params:
      - name_en: image_size
        name_cn: 图像大小
        description: 输入模型前将图像缩放到的边长。
        value: 256
        value_type: int
        value_range: [64, 2048, 1]
        display_type: spin

      - name_en: backbone
        name_cn: 网络结构
        description: 用于提取图像特征的主干网络。
        value: wide_resnet50_2
        value_type: string
        display_type: combo
        options: [wide_resnet50_2, resnet18, resnet50]

      - name_en: image_channels
        name_cn: 图像通道
        description: 当前 anomalib 图像模型要求使用 RGB 三通道输入。
        value: 3
        value_type: int
        display_type: combo
        options: [3]
        enabled: false

      - name_en: pre_trained
        name_cn: 预训练模型
        description: 是否加载主干网络的预训练参数。
        value: true
        value_type: bool
        display_type: checkbox

      - name_en: checkpoint
        name_cn: 初始权重
        description: 训练使用的初始权重：同架构用户已训练权重，留空使用默认初始化。
        value: ""
        value_type: string
        display_type: group_combo
        param_type: dynamic
        backend_key: model.checkpoints
        model_param_name: backbone

      - name_en: layers
        name_cn: 特征层
        description: 从骨干网络提取特征的层，多个层以逗号分隔。
        value: layer2,layer3
        value_type: string
        display_type: text

      - name_en: center_crop_size
        name_cn: 中心裁剪
        description: 训练前进行中心裁剪的目标边长，设为 0 可不裁剪。
        value: 224
        value_type: int
        value_range: [0, 2048, 1]
        display_type: spin

  - name_en: training
    name_cn: 训练配置
    part_index: 0
    params:
      - name_en: max_epochs
        name_cn: Epoch（轮次）
        description: 训练最多完整遍历数据集的次数。
        value: 1
        value_type: int
        value_range: [1, 10000, 1]
        display_type: spin

      - name_en: batch_size
        name_cn: 批量大小
        description: 每次训练或验证处理的图像数量。
        value: 8
        value_type: int
        value_range: [1, 512, 1]
        display_type: spin

      - name_en: device
        name_cn: 设备
        description: 选择执行训练的计算设备。
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: training.compute_devices

      - name_en: num_workers
        name_cn: 数据加载进程
        description: 用于并行读取和预处理数据的工作进程数。
        value: 2
        value_type: int
        value_range: [0, 64, 1]
        display_type: spin

      - name_en: coreset_sampling_ratio
        name_cn: Coreset 采样率
        description: 保留到记忆库中的特征比例。
        value: 0.1
        value_type: double
        value_range: [0.001, 1.0, 0.001]
        display_type: spin

      - name_en: num_neighbors
        name_cn: 近邻数量
        description: 计算异常分数时查询的最近邻数量。
        value: 9
        value_type: int
        value_range: [1, 100, 1]
        display_type: spin

      - name_en: precision
        name_cn: 计算精度
        description: 模型训练和推理使用的浮点计算精度。
        value: float32
        value_type: string
        display_type: combo
        options: [float32, float16]

test_params:
  - name_en: inference
    name_cn: 推理参数
    part_index: 0
    params:
      - name_en: batch_size
        name_cn: 批量大小
        description: 每次推理处理的图像数量。
        value: 8
        value_type: int
        value_range: [1, 512, 1]
        display_type: spin

      - name_en: num_workers
        name_cn: 数据加载进程
        description: 用于并行读取和预处理测试数据的工作进程数。
        value: 2
        value_type: int
        value_range: [0, 64, 1]
        display_type: spin

      - name_en: device
        name_cn: 设备
        description: 选择执行测试的计算设备。
        value_type: string
        param_type: dynamic
        display_type: combo
        backend_key: training.compute_devices

      - name_en: checkpoint
        name_cn: 权重
        description: 推理使用的模型权重：用户已训练权重，留空使用当前模型训练的权重。
        value: ""
        value_type: string
        display_type: group_combo
        param_type: dynamic
        backend_key: model.checkpoints
        model_param_name: backbone

  - name_en: evaluation
    name_cn: 评估参数
    part_index: 1
    params:
      - name_en: classification_threshold
        name_cn: 分类阈值
        description: 图像分数大于等于该值时判定为异常，否则判定为正常。
        value: 0.5
        value_type: double
        value_range: [-1000000.0, 1000000.0, 0.0001]
        display_type: spin

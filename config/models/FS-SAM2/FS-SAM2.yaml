FS-SAM2:
  framework: FS-SAM2
  model_architecture: FS-SAM2
  model_name: FS-SAM2
  method: FewShotLearning
  train_params:
    - name_en: model
      name_cn: 模型
      part_index: 0
      params:
        - name_en: sam2_checkpoint
          name_cn: SAM2 权重
          description: SAM2 基础模型预训练权重文件的路径。
          value: python/fornib/FS-SAM2/checkpoint/sam2.1_hiera_base_plus.pt
          value_type: string
          display_type: file

        - name_en: sam2_cfg
          name_cn: SAM2 配置
          description: SAM2 模型结构与推理设置配置文件的路径。
          value: ""
          value_type: string
          display_type: file

    - name_en: training
      name_cn: 训练参数
      part_index: 0
      params:
        - name_en: kshot
          name_cn: K-shot
          description: 每个类别在小样本训练中使用的支持样本数量。
          value: 1
          value_type: int
          value_range: [1, 16, 1]
          display_type: spin

        - name_en: epochs
          name_cn: 训练轮数
          description: 完整遍历训练数据集的次数。
          value: 50
          value_type: int
          value_range: [1, 10000, 1]
          display_type: spin

        - name_en: batch_size
          name_cn: 批量大小
          description: 每次参数更新参与训练的样本数量。
          value: 8
          value_type: int
          value_range: [1, 128, 1]
          display_type: spin

        - name_en: num_workers
          name_cn: 数据加载进程数
          description: 用于 PyTorch DataLoader 并行读取和预处理数据的进程数。
          value: 2
          value_type: int
          value_range: [0, 128, 1]
          display_type: spin

        - name_en: learning_rate
          name_cn: 学习率
          description: 优化器每次更新模型参数的步长。
          value: 0.0001
          value_type: double
          value_range: [0.000001, 0.01, 0.000001]
          display_type: spin

        - name_en: weight_decay
          name_cn: 权重衰减
          description: 用于抑制过拟合的 L2 正则化强度。
          value: 0.000001
          value_type: double
          value_range: [0.0, 0.01, 0.000001]
          display_type: spin

    - name_en: network
      name_cn: 网络参数
      part_index: 1
      params:
        - name_en: image_size
          name_cn: 图像尺寸
          description: 输入模型前将图像缩放到的边长。
          value: 1024
          value_type: int
          value_range: [64, 8192, 64]
          display_type: spin

  test_params:
    - name_en: model
      name_cn: 模型
      part_index: 0
      params:
        - name_en: sam2_checkpoint
          name_cn: SAM2 权重
          description: SAM2 基础模型预训练权重文件的路径。
          value: python/fornib/FS-SAM2/checkpoint/sam2.1_hiera_base_plus.pt
          value_type: string
          display_type: file

        - name_en: sam2_cfg
          name_cn: SAM2 配置
          description: SAM2 模型结构与推理设置配置文件的路径。
          value: ""
          value_type: string
          display_type: file

    - name_en: inference
      name_cn: 推理参数
      part_index: 0
      params:
        - name_en: checkpoint_path
          name_cn: 检查点路径
          description: 用于小样本推理的已训练模型检查点文件路径。
          value: ""
          value_type: string
          display_type: file

        - name_en: output_dir
          name_cn: 输出目录
          description: 保存推理结果和中间文件的目录。
          value: ""
          value_type: string
          display_type: path

        - name_en: kshot
          name_cn: K-shot
          description: 每个类别在小样本推理中使用的支持样本数量。
          value: 1
          value_type: int
          value_range: [1, 16, 1]
          display_type: spin

        - name_en: image_size
          name_cn: 图像尺寸
          description: 输入模型前将图像缩放到的边长。
          value: 1024
          value_type: int
          value_range: [64, 8192, 64]
          display_type: spin

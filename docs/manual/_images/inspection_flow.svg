<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="100%" height="auto">
  <defs>
    <linearGradient id="inspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009688" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#009688" stop-opacity="0.03"/>
    </linearGradient>
    <marker id="inspArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#009688"/>
    </marker>
    <style>
      .box { fill: url(#inspGrad); stroke: #009688; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "Microsoft YaHei", -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #1f2937; }
      .desc { font-family: "Microsoft YaHei", -apple-system, sans-serif; font-size: 12px; fill: #4b5563; }
      .line { stroke: #009688; stroke-width: 1.8; fill: none; marker-end: url(#inspArrow); }
      @media (prefers-color-scheme: dark) {
        .title { fill: #f3f4f6; }
        .desc { fill: #9ca3af; }
      }
    </style>
  </defs>

  <g transform="translate(15, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">1. 类别与状态过滤</text>
    <text class="desc" x="16" y="66">按缺陷类别筛选实例</text>
    <text class="desc" x="16" y="88">查看各类样本分布数量</text>
    <text class="desc" x="16" y="108">聚焦疑似争议标签</text>
  </g>
  <path class="line" d="M 195 80 L 225 80"/>

  <g transform="translate(225, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">2. 局部缩略图比对</text>
    <text class="desc" x="16" y="66">集中平铺展示实例切片</text>
    <text class="desc" x="16" y="88">快速发现混淆分类</text>
    <text class="desc" x="16" y="108">支持跨图像横向一致性对比</text>
  </g>
  <path class="line" d="M 405 80 L 435 80"/>

  <g transform="translate(435, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">3. 批量选择与调整</text>
    <text class="desc" x="16" y="66">单选或多选目标实例</text>
    <text class="desc" x="16" y="88">属性面板快速重分派类别</text>
    <text class="desc" x="16" y="108">一键删除错误图元</text>
  </g>
  <path class="line" d="M 615 80 L 645 80"/>

  <g transform="translate(645, 20)">
    <rect class="box" width="190" height="120"/>
    <text class="title" x="16" y="38">4. 质量审查闭环</text>
    <text class="desc" x="16" y="66">修改即刻同步图库与标注</text>
    <text class="desc" x="16" y="88">重新校验类别均衡度</text>
    <text class="desc" x="16" y="108">确保高品质数据进入训练</text>
  </g>
</svg>

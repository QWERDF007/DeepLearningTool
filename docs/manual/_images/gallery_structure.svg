<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="100%" height="auto">
  <defs>
    <linearGradient id="galGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009688" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#009688" stop-opacity="0.03"/>
    </linearGradient>
    <marker id="galArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#009688"/>
    </marker>
    <style>
      .box { fill: url(#galGrad); stroke: #009688; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "Microsoft YaHei", -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #1f2937; }
      .desc { font-family: "Microsoft YaHei", -apple-system, sans-serif; font-size: 12px; fill: #4b5563; }
      .line { stroke: #009688; stroke-width: 1.8; fill: none; marker-end: url(#galArrow); }
      @media (prefers-color-scheme: dark) {
        .title { fill: #f3f4f6; }
        .desc { fill: #9ca3af; }
      }
    </style>
  </defs>

  <g transform="translate(15, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">1. 样本图像导入</text>
    <text class="desc" x="16" y="66">格式: JPG/PNG/BMP/WebP</text>
    <text class="desc" x="16" y="88">导入方式: 目录 / 结构化</text>
    <text class="desc" x="16" y="108">自动提取宽、高、通道</text>
  </g>
  <path class="line" d="M 195 80 L 225 80"/>

  <g transform="translate(225, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">2. 数据集划分管理</text>
    <text class="desc" x="16" y="66">训练集 (Train)</text>
    <text class="desc" x="16" y="88">验证集 (Val)</text>
    <text class="desc" x="16" y="108">测试集 (Test)</text>
  </g>
  <path class="line" d="M 405 80 L 435 80"/>

  <g transform="translate(435, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">3. 图库浏览与过滤</text>
    <text class="desc" x="16" y="66">文件名即时拼音/字符过滤</text>
    <text class="desc" x="16" y="88">按标注状态 (已标/未标)</text>
    <text class="desc" x="16" y="108">按缺陷类别多选筛选</text>
  </g>
  <path class="line" d="M 615 80 L 645 80"/>

  <g transform="translate(645, 20)">
    <rect class="box" width="190" height="120"/>
    <text class="title" x="16" y="38">4. 数据集导入与导出</text>
    <text class="desc" x="16" y="66">COCO / LabelMe JSON</text>
    <text class="desc" x="16" y="88">单通道/彩色 Mask 掩膜</text>
    <text class="desc" x="16" y="108">分类 Folder 子目录</text>
  </g>
</svg>

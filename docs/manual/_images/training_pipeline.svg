<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="100%" height="auto">
  <defs>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009688" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#009688" stop-opacity="0.03"/>
    </linearGradient>
    <marker id="trainArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#009688"/>
    </marker>
    <style>
      .box { fill: url(#trainGrad); stroke: #009688; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "Microsoft YaHei", -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #1f2937; }
      .desc { font-family: "Microsoft YaHei", -apple-system, sans-serif; font-size: 12px; fill: #4b5563; }
      .line { stroke: #009688; stroke-width: 1.8; fill: none; marker-end: url(#trainArrow); }
      @media (prefers-color-scheme: dark) {
        .title { fill: #f3f4f6; }
        .desc { fill: #9ca3af; }
      }
    </style>
  </defs>

  <g transform="translate(15, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">1. 添加模型与配置</text>
    <text class="desc" x="16" y="66">添加模型并选择架构</text>
    <text class="desc" x="16" y="88">勾选训练集与验证集</text>
    <text class="desc" x="16" y="108">超参数设置 / 卡片启动</text>
  </g>
  <path class="line" d="M 195 80 L 225 80"/>

  <g transform="translate(225, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">2. 异步训练执行</text>
    <text class="desc" x="16" y="66">独立 Python 引擎解耦</text>
    <text class="desc" x="16" y="88">CUDA 硬件加速推理</text>
    <text class="desc" x="16" y="108">支持随时暂停与停止</text>
  </g>
  <path class="line" d="M 405 80 L 435 80"/>

  <g transform="translate(435, 20)">
    <rect class="box" width="180" height="120"/>
    <text class="title" x="16" y="38">3. 曲线实时监控</text>
    <text class="desc" x="16" y="66">损失函数 (Loss) 衰减</text>
    <text class="desc" x="16" y="88">验证集评估指标同步刷新</text>
    <text class="desc" x="16" y="108">学习率调度器状态显示</text>
  </g>
  <path class="line" d="M 615 80 L 645 80"/>

  <g transform="translate(645, 20)">
    <rect class="box" width="190" height="120"/>
    <text class="title" x="16" y="38">4. 权重自动保存</text>
    <text class="desc" x="16" y="66">自动捕获最高精度 Checkpoint</text>
    <text class="desc" x="16" y="88">生成训练日志与度量指标</text>
    <text class="desc" x="16" y="108">直接提供后续评估与推理</text>
  </g>
</svg>

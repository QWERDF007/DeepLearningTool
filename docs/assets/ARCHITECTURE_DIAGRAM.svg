<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">DeepLearningTool 架构总览</title>
  <desc id="desc">展示 Qt QML、C++ 业务模块、SQLite 数据库以及 Python 模型任务之间的分层和运行时关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17202a; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .band-title { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17202a; text-anchor: middle; }
      .module { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17202a; text-anchor: middle; }
      .body { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; text-anchor: middle; }
      .note { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .box { stroke: #475569; stroke-width: 1.5; rx: 8; }
      .flow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow-soft { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .group { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 8 6; fill: none; rx: 8; }
    </style>
  </defs>

  <rect x="20" y="20" width="1560" height="1080" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="55" y="62" class="title">DeepLearningTool 项目架构图</text>
  <text x="55" y="90" class="subtitle">当前 CMake 模块、Qt/QML 入口、项目聚合、SQLite 持久化与 Python 模型任务运行时</text>

  <!-- 展示层 -->
  <rect x="55" y="120" width="1490" height="150" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="10"/>
  <text x="105" y="150" class="band-title">展示层</text>
  <rect x="185" y="140" width="380" height="100" class="box" fill="#eff6ff"/>
  <text x="375" y="169" class="module">dltool 可执行程序</text>
  <text x="375" y="195" class="body">main.cpp · QApplication · QML Engine</text>
  <text x="375" y="219" class="small">CrashHandler · 日志 · 顶层窗口</text>
  <rect x="610" y="140" width="400" height="100" class="box" fill="#eff6ff"/>
  <text x="810" y="169" class="module">顶层 QML 与公共 UI</text>
  <text x="810" y="195" class="body">Main · Header · Content · Footer</text>
  <text x="810" y="219" class="small">导航 · 任务中心 · 日志 · 通用控件</text>
  <rect x="1055" y="140" width="440" height="100" class="box" fill="#eff6ff"/>
  <text x="1275" y="169" class="module">领域页面</text>
  <text x="1275" y="195" class="body">项目 · 数据 · 模型 · 高级功能</text>
  <text x="1275" y="219" class="small">创建/打开 · 标注 · 训练/测试 · 评估</text>
  <path d="M 565 190 L 605 190" class="flow"/>
  <path d="M 1010 190 L 1050 190" class="flow"/>

  <!-- 业务层 -->
  <rect x="55" y="305" width="1490" height="225" fill="#dcfce7" stroke="#4ade80" stroke-width="2" rx="10"/>
  <text x="105" y="335" class="band-title">业务层</text>
  <rect x="185" y="355" width="285" height="135" class="box" fill="#f0fdf4"/>
  <text x="327" y="386" class="module">dltool_project</text>
  <text x="327" y="414" class="body">ProjectManager · Project</text>
  <text x="327" y="440" class="small">项目生命周期 · 聚合根</text>
  <text x="327" y="462" class="small">currentProject · .dlpro</text>
  <rect x="505" y="355" width="285" height="135" class="box" fill="#f0fdf4"/>
  <text x="647" y="386" class="module">dltool_data</text>
  <text x="647" y="414" class="body">DataManager · Qt Models</text>
  <text x="647" y="440" class="small">Dataset · Image · Label · Tag</text>
  <text x="647" y="462" class="small">导入/导出 · 过滤 · 统计</text>
  <rect x="825" y="355" width="330" height="135" class="box" fill="#f0fdf4"/>
  <text x="990" y="386" class="module">dltool_model</text>
  <text x="990" y="414" class="body">ModelManager · TaskController</text>
  <text x="990" y="440" class="small">训练 · 测试 · 评估 · 任务状态</text>
  <text x="990" y="462" class="small">模型/任务参数与结果</text>
  <rect x="1190" y="355" width="305" height="135" class="box" fill="#f0fdf4"/>
  <text x="1342" y="386" class="module">dltool_feature</text>
  <text x="1342" y="414" class="body">FeatureManager</text>
  <text x="1342" y="440" class="small">图像/ROI 搜索与聚类</text>
  <text x="1342" y="462" class="small">智能标注 · 小样本任务</text>
  <path d="M 810 240 L 810 300" class="flow"/>
  <path d="M 810 300 C 810 315, 327 315, 327 350" class="flow-soft"/>
  <path d="M 810 300 L 647 350" class="flow-soft"/>
  <path d="M 810 300 L 990 350" class="flow-soft"/>
  <path d="M 810 300 C 810 315, 1342 315, 1342 350" class="flow-soft"/>
  <path d="M 790 422 L 820 422" class="flow-soft"/>
  <path d="M 1155 422 L 1185 422" class="flow-soft"/>

  <!-- 支撑层 -->
  <rect x="55" y="565" width="1490" height="160" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="10"/>
  <text x="105" y="595" class="band-title">支撑层</text>
  <rect x="185" y="615" width="250" height="80" class="box" fill="#fffbeb"/>
  <text x="310" y="645" class="module">dltool_common</text>
  <text x="310" y="672" class="small">日志 · 路径 · 图像/文件工具</text>
  <rect x="470" y="615" width="230" height="80" class="box" fill="#fffbeb"/>
  <text x="585" y="645" class="module">dltool_core</text>
  <text x="585" y="672" class="small">任务类型与共享定义</text>
  <rect x="735" y="615" width="275" height="80" class="box" fill="#fffbeb"/>
  <text x="872" y="645" class="module">dltool_parameter</text>
  <text x="872" y="672" class="small">参数 schema · 动态选项</text>
  <rect x="1045" y="615" width="245" height="80" class="box" fill="#fffbeb"/>
  <text x="1167" y="645" class="module">dltool_settings</text>
  <text x="1167" y="672" class="small">YAML 设置 · 全局值</text>
  <rect x="1325" y="615" width="170" height="80" class="box" fill="#fffbeb"/>
  <text x="1410" y="645" class="module">dltool_ui</text>
  <text x="1410" y="672" class="small">主题 · 控件 · 图表</text>
  <path d="M 327 490 C 327 550, 310 550, 310 610" class="flow-soft"/>
  <path d="M 647 490 C 647 550, 585 550, 585 610" class="flow-soft"/>
  <path d="M 990 490 C 990 550, 872 550, 872 610" class="flow-soft"/>
  <path d="M 1342 490 C 1342 550, 1410 550, 1410 610" class="flow-soft"/>

  <!-- 持久化与外部运行时 -->
  <rect x="55" y="760" width="1490" height="170" fill="#fce7f3" stroke="#ec4899" stroke-width="2" rx="10"/>
  <text x="105" y="790" class="band-title">数据与外部运行时</text>
  <rect x="185" y="810" width="405" height="90" class="box" fill="#fff1f2"/>
  <text x="387" y="840" class="module">dltool_database</text>
  <text x="387" y="867" class="body">ProjectDataBase · ModelDataBase</text>
  <text x="387" y="889" class="small">.dlpro · model.db · task.db · settings.db</text>
  <rect x="640" y="810" width="370" height="90" class="box" fill="#fff1f2"/>
  <text x="825" y="840" class="module">本地文件与预测产物</text>
  <text x="825" y="867" class="body">数据列表 · 权重 · 日志 · pred/*.tiff</text>
  <text x="825" y="889" class="small">模型和测试任务目录</text>
  <rect x="1060" y="810" width="435" height="90" class="box" fill="#fff1f2"/>
  <text x="1277" y="840" class="module">Python 模型运行时</text>
  <text x="1277" y="867" class="body">EasyTrain · anomalib · ultralytics</text>
  <text x="1277" y="889" class="small">QProcess · TCP · CUDA/OpenCV/InferRT</text>
  <path d="M 647 490 C 647 650, 387 650, 387 805" class="flow-soft"/>
  <path d="M 990 490 C 990 650, 825 650, 825 805" class="flow-soft"/>
  <path d="M 990 490 C 1100 650, 1277 650, 1277 805" class="flow"/>

  <!-- 任务与评估链路 -->
  <rect x="55" y="965" width="1490" height="105" fill="#e0e7ff" stroke="#818cf8" stroke-width="2" rx="10"/>
  <text x="105" y="995" class="band-title">模型任务主链路</text>
  <rect x="210" y="990" width="170" height="50" class="box" fill="#eef2ff"/>
  <text x="295" y="1021" class="body">QML 模型页面</text>
  <rect x="420" y="990" width="190" height="50" class="box" fill="#eef2ff"/>
  <text x="515" y="1021" class="body">任务准备/数据导出</text>
  <rect x="650" y="990" width="180" height="50" class="box" fill="#eef2ff"/>
  <text x="740" y="1021" class="body">QProcess + TCP</text>
  <rect x="870" y="990" width="180" height="50" class="box" fill="#eef2ff"/>
  <text x="960" y="1021" class="body">Python 训练/推理</text>
  <rect x="1090" y="990" width="180" height="50" class="box" fill="#eef2ff"/>
  <text x="1180" y="1021" class="body">pred + task.db</text>
  <rect x="1310" y="990" width="180" height="50" class="box" fill="#eef2ff"/>
  <text x="1400" y="1021" class="body">评估 ViewModel</text>
  <path d="M 380 1015 L 415 1015" class="flow"/>
  <path d="M 610 1015 L 645 1015" class="flow"/>
  <path d="M 830 1015 L 865 1015" class="flow"/>
  <path d="M 1050 1015 L 1085 1015" class="flow"/>
  <path d="M 1270 1015 L 1305 1015" class="flow"/>

  <text x="70" y="1093" class="note">实线：主要运行时调用/任务方向　　虚线：模块复用、持久化或异步后台关系　　源码与 CMake 是图示的最终事实源</text>
</svg>
